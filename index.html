<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Code + Output</title>

  <style>
    /* ===== CSS = design ===== */
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1e293b;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 17px;
      margin: 0;
      color: #38bdf8;
    }

    button {
      background: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 9px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #0ea5e9; }
    button:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    /* ---- Side-by-side layout ---- */
    .container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: #334155;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      background: #0f172a;
      overflow: hidden;
    }

    .panel-title {
      padding: 8px 15px;
      background: #1e293b;
      font-size: 13px;
      color: #94a3b8;
      border-bottom: 1px solid #334155;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    textarea {
      flex: 1;
      background: #0f172a;
      color: #e2e8f0;
      border: none;
      padding: 15px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
      resize: none;
      outline: none;
    }

    pre {
      flex: 1;
      margin: 0;
      padding: 15px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      color: #4ade80;
    }
    pre.error { color: #f87171; }

    /* ---- Mobile: ऊपर-नीचे ---- */
    @media (max-width: 700px) {
      .container {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>🐍 Python Code + Output</h1>
    <button id="runBtn" disabled>⏳ Python लोड हो रहा है...</button>
  </header>

  <div class="container">
    <!-- बायीं तरफ: Code -->
    <div class="panel">
      <div class="panel-title">📝 Code (यहाँ लिखो / बदलो)</div>
      <textarea id="codeInput" spellcheck="false"># ================================
#   मेरा पहला Python Program
# ================================

def namaste(naam):
    print("नमस्ते,", naam, "! 🙏")

def calculator(a, b, op):
    if op == "+": return a + b
    elif op == "-": return a - b
    elif op == "*": return a * b
    elif op == "/":
        if b == 0:
            return "0 से भाग नहीं होता!"
        return a / b

def even_odd(n):
    return "Even" if n % 2 == 0 else "Odd"

def square(n):
    return n * n

# ---- मुख्य program ----
print("=" * 30)
print("  मेरा पहला Python Program")
print("=" * 30)

namaste("आरव")
namaste("सीता")

print("\nEven / Odd:")
for num in [3, 8, 15, 20]:
    print(f"  {num} → {even_odd(num)}")

print("\nSquare:")
for n in [2, 5, 9]:
    print(f"  {n}² = {square(n)}")

print("\nCalculator:")
print("  10 + 5 =", calculator(10, 5, "+"))
print("  10 * 5 =", calculator(10, 5, "*"))
print("  10 / 0 =", calculator(10, 0, "/"))

print("\n✅ Program खत्म!")
</textarea>
    </div>

    <!-- दायीं तरफ: Output -->
    <div class="panel">
      <div class="panel-title">▶️ Output (यहाँ result दिखेगा)</div>
      <pre id="output">Python लोड हो रहा है... पहली बार 5–10 सेकंड लग सकते हैं ⏳</pre>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
  <script>
    // ===== JavaScript = page को काम करवाना =====
    const runBtn    = document.getElementById("runBtn");
    const codeInput = document.getElementById("codeInput");
    const output    = document.getElementById("output");

    let pyodide = null;

    // ---- Python load करना ----
    async function loadPython() {
      try {
        pyodide = await loadPyodide({
          stdout: (text) => appendOutput(text),
          stderr: (text) => appendOutput(text)
        });
        runBtn.disabled = false;
        runBtn.innerText = "▶ Run चलाओ";
        output.innerText = "✅ तैयार! ऊपर 'Run चलाओ' दबाओ।";
      } catch (e) {
        output.innerText = "❌ Python load नहीं हुआ: " + e.message;
      }
    }

    // ---- Output में line जोड़ना ----
    function appendOutput(text) {
      if (output.innerText.startsWith("✅") || output.innerText.startsWith("Python")) {
        output.innerText = "";
      }
      output.innerText += text + "\n";
    }

    // ---- Code चलाना ----
    async function runCode() {
      output.classList.remove("error");
      output.innerText = "";
      runBtn.disabled = true;
      runBtn.innerText = "⏳ चल रहा है...";

      try {
        await pyodide.runPythonAsync(codeInput.value);
      } catch (err) {
        output.classList.add("error");
        output.innerText += "\n❌ Error:\n" + err.message;
      }

      runBtn.disabled = false;
      runBtn.innerText = "▶ Run चलाओ";
    }

    runBtn.addEventListener("click", runCode);
    loadPython();
  </script>
</body>
</html>
